apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.kapt"
apply plugin: "com.facebook.react"
apply plugin: "com.chaquo.python"

import java.util.Properties

def uploadKeyProperties = new Properties()
def uploadKeyPropertiesFile = rootProject.file("keystore.properties")
if (uploadKeyPropertiesFile.exists()) {
    uploadKeyPropertiesFile.withInputStream { uploadKeyProperties.load(it) }
}

def signingValue = { String propertyName, String environmentName ->
    def value = System.getenv(environmentName) ?: uploadKeyProperties.getProperty(propertyName)
    value?.toString()?.trim()
}
def uploadStorePath = signingValue("storeFile", "AIRPLANEMODE_UPLOAD_STORE_FILE")
def uploadStorePassword = signingValue("storePassword", "AIRPLANEMODE_UPLOAD_STORE_PASSWORD")
def uploadKeyAlias = signingValue("keyAlias", "AIRPLANEMODE_UPLOAD_KEY_ALIAS")
def uploadKeyPassword = signingValue("keyPassword", "AIRPLANEMODE_UPLOAD_KEY_PASSWORD")
def uploadSigningValues = [
    uploadStorePath,
    uploadStorePassword,
    uploadKeyAlias,
    uploadKeyPassword,
]
def uploadSigningConfigured = uploadSigningValues.every { it }
if (uploadSigningValues.any { it } && !uploadSigningConfigured) {
    throw new GradleException(
        "Release signing is incomplete. Configure every value in android/keystore.properties " +
        "or with the AIRPLANEMODE_UPLOAD_* environment variables."
    )
}
def uploadStore = uploadSigningConfigured ? rootProject.file(uploadStorePath) : null
if (uploadStore != null && !uploadStore.exists()) {
    throw new GradleException("Release keystore does not exist: ${uploadStore.absolutePath}")
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.airplanemode"
    defaultConfig {
        applicationId "com.airplanemode"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.1"
        manifestPlaceholders = [usesCleartextTraffic: "false"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (uploadSigningConfigured) {
            release {
                storeFile uploadStore
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            if (uploadSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        preview {
            initWith release
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview"
            signingConfig signingConfigs.debug
            matchingFallbacks = ["release"]
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            resValue "string", "app_name", "AirplaneMode Preview"
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

tasks.register("verifyReleaseSigning") {
    group = "verification"
    description = "Fails unless a private upload keystore is configured for production release builds."
    doLast {
        if (!uploadSigningConfigured) {
            throw new GradleException(
                "Production release signing is not configured. Configure " +
                "android/keystore.properties.example or use assemblePreview for sideload testing."
            )
        }
    }
}

tasks.matching { it.name == "assembleRelease" || it.name == "bundleRelease" }.configureEach {
    dependsOn("verifyReleaseSigning")
}

chaquopy {
    defaultConfig {
        version = "3.14"
        pip {
            install("yt-dlp==2026.8.19")
            install("yt-dlp-ejs==0.8.0")
            install("certifi")
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def roomVersion = "2.8.4"
    implementation("androidx.room:room-runtime:${roomVersion}")
    kapt("androidx.room:room-compiler:${roomVersion}")

    def media3Version = "1.10.1"
    implementation("androidx.media3:media3-exoplayer:${media3Version}")
    implementation("androidx.media3:media3-session:${media3Version}")
    implementation("androidx.media3:media3-ui:${media3Version}")
    implementation("androidx.media3:media3-transformer:${media3Version}")
    implementation("androidx.media3:media3-datasource:${media3Version}")
    implementation("androidx.media3:media3-datasource-okhttp:${media3Version}")
    implementation("androidx.media3:media3-database:${media3Version}")
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("androidx.work:work-runtime-ktx:2.11.2")

    testImplementation("junit:junit:4.13.2")
    androidTestImplementation("androidx.test:runner:1.7.0")
    androidTestImplementation("androidx.test.ext:junit:1.3.0")
    androidTestImplementation("androidx.test:core:1.7.0")
    androidTestImplementation("androidx.room:room-testing:${roomVersion}")
    androidTestImplementation("com.squareup.okhttp3:mockwebserver:4.12.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
